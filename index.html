<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- GOOGLE FONTS -->
    <!-- NEED FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Micro+5+Charted&display=swap" rel="stylesheet">
    <!-- MY STYLE -->
    <link rel="stylesheet" href="./style.css">
    <title>Fun Web RPG Game</title>
</head>

<body>
    <section class="start">
        <button class="continuePlayer">CONTINUE</button>
        <button class="newPlayer">NEW PLAYER</button>
    </section>
    <section class="play">
        <button class="quit">X</button>
        <div class="player">
            <img src="./character_nobg.png" alt="">
            <ul>
                <li class="level">
                    <div>
                        Level <span class="characterLevel"></span>
                    </div>
                    <div>
                        <div class="expMax"></div>
                        <p class="characterExp">0 / 25</p>
                    </div>
                </li>
                <li>HP / HP MAX</li>
                <li>Defense</li>
                <li>iLevel</li>
                <li>Strenght</li>
                <li>Dexterity</li>
                <li>Intelligence</li>
                <li>Consitution</li>
                <li>Speed</li>
            </ul>
        </div>
        <div>
            <button class="buttonHunt">HUNT</button>
            <div class="huntResult">
                <p>x exp recieved</p>
                <p>x wood recieved</p>
                <p>x piece of gear recieved</p>
                <button class="buttonCloseHunt">CLOSE</button>
            </div>
        </div>
    </section>
</body>

</html>

<script src="./main.js"></script>
