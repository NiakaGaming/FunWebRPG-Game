<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- GOOGLE FONTS -->
    <!-- NEED FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Micro+5+Charted&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Micro+5+Charted&family=Sixtyfour+Convergence&family=Tiny5&display=swap"
        rel="stylesheet">
    <!-- MY STYLE -->
    <link rel="stylesheet" href="./style.css">
    <title>Fun Web RPG Game</title>
</head>

<body>
    <section class="start">
        <button class="continuePlayer">CONTINUE</button>
        <button class="newPlayer">NEW PLAYER</button>
    </section>
    <section class="play">

        <div>
            <button class="quit">X</button>
        </div>

        <div class="player">
            <!-- CHARACTERS STAT -->
            <ul>
                <li class="player-bar">
                    <div>
                        Level <span class="characterLevel"></span>
                    </div>
                    <div>
                        <div class="expMax"></div>
                        <p class="characterExp">0 / 25</p>
                    </div>
                </li>
                <li class="player-bar">
                    <div>
                        Health
                    </div>
                    <div>
                        <div class="hpMax"></div>
                        <p class="characterHpBar">100 / 100</p>
                    </div>
                </li>
                <li class="player-bar">
                    <div>
                        Mana
                    </div>
                    <div>
                        <div class="mpMax"></div>
                        <p class="characterMpBar">10 / 10</p>
                    </div>
                </li>
                </li>
                <li>iLevel</li>
                <li>Defense</li>
                <li>Strenght</li>
                <li>Dexterity</li>
                <li>Intelligence</li>
                <li>Speed</li>
                <li>DPS</li>
            </ul>

            <!-- CHARACTERS AVATAR -->
            <div class="avatar">
                <img src="./character_nobg.png" alt="">
            </div>

            <!-- CHARACTERS GEAR -->
            <div class="gear">
                <div class="gearGloves" ondrop="drop(event)" ondragover="allowDrop(event)">
                    <img src="./Assets/items/simple_gloves.png" alt="">
                </div>
                <div class="gearHead" ondrop="drop(event)" ondragover="allowDrop(event)">
                    <img src="./Assets/items/simple_helmet.png" alt="">
                </div>
                <div class="gearAmulet" ondrop="drop(event)" ondragover="allowDrop(event)">
                    <img src="./Assets/items/sorcerer_amulet.png" alt="">
                </div>
                <div class="gear1stWeapon" ondrop="drop(event)" ondragover="allowDrop(event)">
                    <img src="./Assets/items/training_sword.png" alt="">
                </div>
                <div class="gearChest" ondrop="drop(event)" ondragover="allowDrop(event)">
                    <img src="./Assets/items/simple_chest.png" alt="">
                </div>
                <div class="gear2ndWeapon" ondrop="drop(event)" ondragover="allowDrop(event)">
                    <img src="./Assets/items/wooden_shield.png" alt="">
                </div>
                <div class="gearBelt" ondrop="drop(event)" ondragover="allowDrop(event)">
                    <img src="" alt="">
                </div>
                <div class="gear1stRing" ondrop="drop(event)" ondragover="allowDrop(event)">
                    <img src="./Assets/items/simple_ring.png" alt="">
                </div>
                <div class="gearFeet" ondrop="drop(event)" ondragover="allowDrop(event)">
                    <img src="./Assets/items/simple_boots.png" alt="">
                </div>
                <div class="gear2ndRing" ondrop="drop(event)" ondragover="allowDrop(event)">
                    <img src="./Assets/items/constitution_ring.png" alt="">
                </div>
            </div>

            <!-- CHARACTERS INVENTORTY -->
            <div class="inventory">
                <div class="row">
                    <div class="col inv-0" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
                    <div class="col inv-1" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
                    <div class="col inv-2" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
                    <div class="col inv-3" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
                </div>
                <div class="row">
                    <div class="col inv-4" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
                    <div class="col inv-5" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
                    <div class="col inv-6" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
                    <div class="col inv-7" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
                </div>
                <div class="row">
                    <div class="col inv-8" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
                    <div class="col inv-9" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
                    <div class="col inv-10" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
                    <div class="col inv-11" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
                </div>
                <div class="row">
                    <div class="col inv-12" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
                    <div class="col inv-13" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
                    <div class="col inv-14" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
                    <div class="col inv-15" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
                </div>
            </div>

            <div class="utils">
                <img src="./Assets/items/trash-can.png" alt="">
                <img src="./Assets/items/trash-can.png" alt="">
                <img src="./Assets/items/trash-can.png" alt="">
                <img src="./Assets/items/trash-can.png" alt="">
            </div>

        </div>
        <div>
            <button class="buttonHunt">HUNT</button>
            <div class="huntResult">
                <p>x exp recieved</p>
                <p>x wood recieved</p>
                <p>x piece of gear recieved</p>
                <button class="buttonCloseHunt">CLOSE</button>
            </div>
        </div>
    </section>
</body>

</html>

<script src="./main.js"></script>
